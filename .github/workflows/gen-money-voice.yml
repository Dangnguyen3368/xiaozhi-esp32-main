name: Generate money voice clips

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/money_voice/gen.py"

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - run: python tools/money_voice/gen.py
      - uses: actions/upload-artifact@v4
        with:
          name: money_vi
          path: main/assets/money_vi/*.ogg
