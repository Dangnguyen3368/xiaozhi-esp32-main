name: Generate money voice clips

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/money_voice/gen.py"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - run: python tools/money_voice/gen.py
      - name: Commit clips to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main/assets/money_vi/*.ogg
          git diff --cached --quiet || git commit -m "Add generated money voice clips"
          git push
